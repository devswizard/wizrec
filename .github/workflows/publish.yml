# Publishes a draft GitHub Release created by release.yml, with the workflow's own
# GITHUB_TOKEN (no personal token needed). Before flipping draft -> public it downloads the
# draft's assets, checks them against SHA256SUMS.txt, runs scripts/release/verify-dmg.sh
# (mount, signature, load paths, launch) and refuses notes with AI attribution lines.
# Idempotent: an already public release is left alone.
#
# Triggers: a push to main that changes release/publish (first non-comment line = tag), or
# by hand with a tag. See docs/RELEASING.md, "Publishing a release".
name: Publish release

on:
  push:
    branches: [main]
    paths: [release/publish]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release to publish (default: the one in release/publish)"
        required: false
      dry_run:
        description: "Run every check but keep the draft"
        type: boolean
        default: false
      allow_build_rpaths:
        description: "Accept Xcode/Homebrew run paths in the app (DMGs built before 2026-10-20, e.g. v0.1.0)"
        type: boolean
        default: false

permissions:
  contents: write   # read drafts, download their assets, publish

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag to publish
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_ALLOW: ${{ github.event.inputs.allow_build_rpaths }}
        run: |
          set -euo pipefail
          # Request line: "<tag> [allow-build-rpaths]". The flag is for DMGs built before
          # bundle-dylibs.sh stripped Xcode's run path (v0.1.0); see verify-dmg.sh.
          line=$(grep -vE '^[[:space:]]*(#|$)' release/publish | head -n 1 || true)
          read -r file_tag flag _ <<< "$line" || true
          tag="${INPUT_TAG:-$file_tag}"
          allow=0
          if [ "$tag" = "$file_tag" ] && [ "${flag:-}" = allow-build-rpaths ]; then allow=1; fi
          if [ "${INPUT_ALLOW:-false}" = true ]; then allow=1; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error title=Publish::invalid tag '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "allow_build_rpaths=$allow" >> "$GITHUB_OUTPUT"
          echo "::notice title=Publish::$tag (build run paths allowed: $allow)"

      - name: Verify assets and publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          WIZREC_BUNDLE_ID: ${{ vars.WIZREC_BUNDLE_ID }}
          WIZREC_ALLOW_BUILD_RPATHS: ${{ steps.tag.outputs.allow_build_rpaths }}
          # A request pushed together with its tag waits for release.yml to attach the DMG.
          WAIT_MINUTES: ${{ github.event_name == 'push' && '75' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          WORK_DIR: ${{ runner.temp }}/publish
        # Raw logs need sign-in; errors and the result also become annotations, which the
        # public API shows.
        run: |
          log="$RUNNER_TEMP/publish.log"
          rc=0
          scripts/release/publish-release.sh "$TAG" > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" != 0 ]; then
            grep -E "error|FAILED|WARNING|curl: " "$log" | head -n 20 | while IFS= read -r line; do
              echo "::error title=Publish ${TAG}::${line}"
            done
            exit "$rc"
          fi
          tail -n 1 "$log" | while IFS= read -r line; do echo "::notice title=Publish ${TAG}::${line}"; done
