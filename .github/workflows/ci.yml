# Build and test on Apple silicon. Golden-frame tests skip (no REFS_DIR on CI),
# perf tests skip (no WIZREC_PERF=1), and the opt-in capture / Apple Speech /
# whisper.cpp suites stay off (they need TCC permissions or models). Tests that
# read the user's own projects (~/Documents) or /Applications/Camtasia.app skip
# when those are absent. The asset audit (AssetAuditTests) runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: swift build + test (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          # Newest non-beta, non-RC Xcode on the image (Xcode_<version>.app).
          xcode="$( (find /Applications -maxdepth 1 -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' 2>/dev/null \
            | sort -V | tail -n 1) || true)"
          xcode="${xcode:-/Applications/Xcode.app}"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
          uname -m
          # Public annotation, so the toolchain is visible without opening the log.
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"

      - name: Install FFmpeg and pkg-config
        run: |
          brew update --quiet || true
          brew install ffmpeg pkg-config
          pkg-config --modversion libavcodec

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-O-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-O-${{ runner.os }}-${{ runner.arch }}-

      - name: Check shell scripts parse
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/release/*.sh Design/AppIcon/build-icon.sh; do
            bash -n "$f"
          done

      - name: Resolve packages (Sparkle, pinned in Package.resolved)
        run: |
          for _ in 1 2 3; do swift package resolve && exit 0; sleep 10; done
          exit 1

      - name: Build
        run: |
          set -o pipefail
          # Errors become annotations (readable through the public API, unlike raw logs).
          if ! swift build -Xswiftc -O 2>&1 | tee build.log; then
            grep -E "(error|fatal error):" build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error title=swift build -Xswiftc -O::${line}"
            done
            exit 1
          fi

      # Tests run optimized (-O on every Swift module, still the debug configuration: DEBUG,
      # -enable-testing and @testable stay as they are). Debug-build DSP, decode, render and SSIM
      # made the serial media step ~2.5x slower (QA12-1: 296 s → 117 s locally). Both test steps use
      # this build (`--skip-build`); `Build` uses the same flags so this step is incremental, and the
      # cache key carries `O` so a cache of -Onone objects is never restored.
      - name: Build tests
        timeout-minutes: 40
        run: |
          set -o pipefail
          start=$(date +%s)
          if ! swift build --build-tests -Xswiftc -O 2>&1 | tee build-tests.log; then
            grep -E "(error|fatal error):" build-tests.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error title=swift build --build-tests -Xswiftc -O::${line}"
            done
            exit 1
          fi
          echo "::notice title=build-tests::took $(( $(date +%s) - start )) s"

      # Media-heavy suites encode and decode through AVFoundation/VideoToolbox. On GitHub's
      # 3-core macOS VMs several such sessions at once stalled inside CoreMedia (writers and
      # readers never finished), so those suites run one test at a time in their own step.
      # PerfTests joins them: its wait-helper self-tests need free GCD threads.
      - name: Test (all but media I/O, parallel)
        timeout-minutes: 30
        env:
          REFS_DIR: ""
          WIZREC_PERF: ""
          WIZREC_CAPTURE_TESTS: ""
          WIZREC_SPEECH_TESTS: ""
          WIZREC_WHISPER_TESTS: ""
          TEST_DEADLINE_SECONDS: "1500"
          TEST_LOG: test-core.log
        run: scripts/ci/test-with-watchdog.sh --skip '^(GoldenTests|RecorderTests|ExporterTests|MediaEngineTests|PlayerKitTests|PerfTests)\.'

      - name: Test (media I/O, serial)
        if: success() || failure()
        timeout-minutes: 50
        env:
          REFS_DIR: ""
          WIZREC_PERF: ""
          WIZREC_CAPTURE_TESTS: ""
          WIZREC_SPEECH_TESTS: ""
          WIZREC_WHISPER_TESTS: ""
          TEST_DEADLINE_SECONDS: "2700"
          TEST_LOG: test-media.log
        run: scripts/ci/test-with-watchdog.sh --no-parallel --filter '^(GoldenTests|RecorderTests|ExporterTests|MediaEngineTests|PlayerKitTests|PerfTests)\.'
