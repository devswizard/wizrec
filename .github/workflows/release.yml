# Release build: app bundle with FFmpeg and Sparkle inside, signature, optional notarization,
# DMG, smoke test (mount + launch), optional signed Sparkle appcast.
# Runs on version tags and by hand. Signs and notarizes only when the repository secrets
# exist; otherwise produces an ad-hoc signed DMG. On a version tag the DMG is attached to
# a GitHub Release (draft: a maintainer publishes it); a manual run only keeps the
# workflow artifact. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (default: tag without the leading v, or 0.0.0-dev)"
        required: false

permissions:
  contents: write   # create the tag's GitHub Release

jobs:
  release:
    name: Build DMG (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make-app.sh numbers builds with `git rev-list --count HEAD`

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          xcode="$( (ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n 1) || true)"
          sudo xcode-select -s "${xcode:-/Applications/Xcode.app}/Contents/Developer"
          swift --version

      - name: Install FFmpeg, pkg-config and librsvg
        # librsvg provides rsvg-convert for Design/AppIcon/build-icon.sh (make-app.sh).
        run: brew install ffmpeg pkg-config librsvg

      - name: Version
        id: version
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=${v:-0.0.0-dev}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate (only when secrets exist)
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "No signing secrets: ad-hoc build."
            exit 0
          fi
          kc="$RUNNER_TEMP/wizrec.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Notary profile (only when secrets exist)
        id: notary
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "${{ steps.signing.outputs.identity }}" ]; then exit 0; fi
          xcrun notarytool store-credentials wizrec-ci --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$PASSWORD" --keychain "$RUNNER_TEMP/wizrec.keychain-db"
          echo "profile=wizrec-ci" >> "$GITHUB_OUTPUT"

      - name: Sparkle appcast key (only when the secret and variables exist)
        id: sparkle
        env:
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          FEED: ${{ vars.WIZREC_SPARKLE_FEED }}
          PREFIX: ${{ vars.WIZREC_DOWNLOAD_PREFIX }}
        run: |
          set -euo pipefail
          if [ -z "$ED_KEY" ] || [ -z "$FEED" ] || [ -z "$PREFIX" ]; then
            echo "No Sparkle key/feed/download prefix: no appcast."
            exit 0
          fi
          umask 077
          printf '%s' "$ED_KEY" > "$RUNNER_TEMP/sparkle-ed.key"
          echo "enabled=1" >> "$GITHUB_OUTPUT"

      - name: Build release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WIZREC_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          WIZREC_NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
          WIZREC_BUNDLE_ID: ${{ vars.WIZREC_BUNDLE_ID }}
          NOTARIZE: ${{ steps.notary.outputs.profile != '' && '1' || '0' }}
          # Public values (repository variables); both unset → the app's updater is off.
          WIZREC_SPARKLE_FEED: ${{ vars.WIZREC_SPARKLE_FEED }}
          WIZREC_SPARKLE_PUBKEY: ${{ vars.WIZREC_SPARKLE_PUBKEY }}
          SPARKLE: ${{ steps.sparkle.outputs.enabled == '1' && '1' || '0' }}
          SPARKLE_KEY_FILE: ${{ steps.sparkle.outputs.enabled == '1' && format('{0}/sparkle-ed.key', runner.temp) || '' }}
          WIZREC_DOWNLOAD_PREFIX: ${{ vars.WIZREC_DOWNLOAD_PREFIX }}
          VERIFY: "1"
        run: scripts/release.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: WizRec-${{ steps.version.outputs.version }}
          path: |
            build/WizRec-*.dmg
            build/updates/appcast.xml
          if-no-files-found: error

      - name: Attach DMG to a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(build/WizRec-*.dmg)
          [ -f build/updates/appcast.xml ] && files+=(build/updates/appcast.xml)
          shasum -a 256 build/WizRec-*.dmg > build/SHA256SUMS.txt
          files+=(build/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --title "WizRec $TAG" \
              --notes-file docs/release-notes-template.md
          fi

      - name: Remove temporary keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/wizrec.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle-ed.key"
