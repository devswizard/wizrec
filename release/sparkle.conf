# Sparkle update feed of release builds, read by scripts/release/sparkle-info.sh (make-app.sh
# writes the values into Info.plist as SUFeedURL and SUPublicEDKey).
#
# The updater is on only when public_ed_key is set. It stays empty until the maintainer
# creates the key pair once (docs/RELEASING.md, "Sparkle: turning updates on"). Only the
# PUBLIC key goes here; the private key never enters the repository.
# WIZREC_SPARKLE_FEED / WIZREC_SPARKLE_PUBKEY in the environment override these values.

# The appcast lives in this repository (release/appcast.xml on main) and is served by
# raw.githubusercontent.com: no web host, no GitHub settings change, history in git.
feed_url = https://raw.githubusercontent.com/devswizard/wizrec/main/release/appcast.xml

# Base64 Ed25519 public key, as printed by Sparkle's `generate_keys -p`.
public_ed_key =
